  target_count: 40
  max_count: 45
  max_per_source: 6
  max_mild_expression: 6
  angle_min: {FRONTAL: 12, THREE_QUARTER: 12, SIDE: 4}
  angle_max: {FRONTAL: 20, THREE_QUARTER: 24, SIDE: 12}
  pitch_min: {LOOKING_UP: 1, LOOKING_DOWN: 1}
  composition_min: {CLOSE_UP: 12, UPPER_BODY: 16, FULL_BODY: 6}
  composition_max: {CLOSE_UP: 16, UPPER_BODY: 24, FULL_BODY: 12}
step8_review:
