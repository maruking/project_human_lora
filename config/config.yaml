project:
  name: real_human_lora
  target_person_name: target_person
  trigger_word: character
  subject_name: Sasha
paths:
  input_video_dir: C:\Users\maruk\Documents\Genelate_img\Sasha_re_codex\original-mp4
  reference_face_dir: input/reference
  raw_frames_dir: work/frames_raw
  facegate_review_dir: work/facegate_review
  facegate_crops_dir: work/facegate_face_crops
  pose_review_dir: work/pose_review
  deduplicated_dir: work/frames_deduplicated
